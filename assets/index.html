<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>小红书爆款素材+选题工作台搭建</title>
<style>
:root{color-scheme:light;--ink:#162335;--muted:#667085;--line:#e2e7ef;--blue:#215cce;--bg:#f4f6fa}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif;color:var(--ink);background:var(--bg)}main{max-width:1220px;margin:auto;padding:36px 28px}header{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}h1{font-size:30px;letter-spacing:-1px;margin:0 0 4px}p{margin:6px 0;color:var(--muted)}.eyebrow{color:var(--blue);font-weight:700;font-size:12px;letter-spacing:2px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:8px;padding:9px 15px}button.primary,button.active{background:var(--blue);color:white;border-color:var(--blue)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 16px}input,select,textarea{padding:9px 12px;border:1px solid #cdd5e0;border-radius:7px;background:white;max-width:100%;color:var(--ink)}#search{flex:1;min-width:160px}.panel{background:white;border:1px solid var(--line);border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:740px;text-align:left}th{font-weight:600;color:var(--muted);font-size:12px;background:#f9fafc}th,td{padding:16px 18px;border-bottom:1px solid var(--line);vertical-align:top}tbody tr:last-child td{border-bottom:0}td .title{font-weight:650;margin-bottom:5px;line-height:1.5}td small{color:var(--muted)}a{color:var(--blue);text-decoration:none}.pill{display:inline-block;padding:3px 8px;border-radius:5px;background:#eef3fc;color:#305c9b;font-size:12px}.empty{text-align:center;padding:58px 24px;color:var(--muted)}.hint{font-size:13px;margin-top:18px}.services{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.service{padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:white;font-size:13px}.good{color:#166534}.bad{color:#b42318}.small{font-size:12px;color:var(--muted)}#notice{min-height:26px;color:#9a3412;font-size:13px}dialog{border:1px solid var(--line);border-radius:14px;max-width:780px;width:calc(100% - 32px);padding:25px;max-height:90vh;overflow:auto}dialog::backdrop{background:#16233570}h2{margin:0 0 12px;font-size:22px}h3{margin:20px 0 8px;font-size:15px}.form{display:grid;gap:11px}.form label{font-size:13px;font-weight:600}.form input,.form textarea,.form select{width:100%;display:block;margin-top:4px}.form textarea{min-height:90px}pre{white-space:pre-wrap;word-break:break-word;font:14px/1.8 system-ui;background:#f7f9fc;padding:14px;border-radius:8px}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.cover{max-width:130px;max-height:165px;object-fit:contain;border-radius:5px;margin:8px 0}.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.desc{max-width:500px}.count{font-size:13px;color:var(--muted)}@media(max-width:650px){main{padding:22px 15px}header{display:block}header button{margin-top:12px}h1{font-size:25px}}
</style></head><body><main>
<header><div><div class="eyebrow">AI MEDIA / CONTENT LIBRARY</div><h1>小红书爆款素材+选题工作台</h1><p id="direction">收集参考 · 扩展选题 · 持续创作</p></div><button id="refresh">刷新内容</button></header>
<div id="services" class="services" aria-label="工具最近测试状态"></div>
<div class="tools"><button id="materialsTab" class="active">爆款素材库</button><button id="topicsTab">选题库</button><input id="search" aria-label="搜索内容" placeholder="搜索标题、作者、分类或选题"><select id="filter" aria-label="筛选分类"></select><button id="add" class="primary">录入参考</button></div>
<div id="notice" role="status"></div><div class="panel" id="list"></div>
<p class="hint">给 AI 发送作品链接，或请它收集对标、生成选题；完成后刷新这里。页面支持查看、手动录入和更新进度，不会自动发布。</p>
</main>
<dialog id="detail"><div id="detailBody"></div><div class="actions"><button id="closeDetail">关闭</button></div></dialog>
<dialog id="editor"><h2>录入参考素材</h2><p>保存你已经拿到的内容。只有链接时会标记“待提取”，再交给 AI 采集。</p><form id="materialForm" class="form"><label>原作品链接<input name="url" required type="url"></label><label>原帖标题（从原帖或分享文案核对）<input name="title" required></label><label>作者<input name="author"></label><label>模板分类<input name="category" placeholder="例如：工具对比型、互动贴"></label><label>原始正文或提取原文<textarea name="source_content"></textarea></label><label>我想借鉴什么<textarea name="learning_point"></textarea></label><div class="actions"><button type="button" id="cancelEdit">取消</button><button class="primary">保存素材</button></div></form></dialog>
<script>
const TOKEN='__LOCAL_TOKEN__';let state={materials:[],topics:[]},tab='materials';const $=id=>document.getElementById(id);
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function link(url,text){const a=el('a',text);if(/^https?:\/\//.test(url||'')){a.href=url;a.target='_blank';a.rel='noopener noreferrer'}return a}
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Library-Token':TOKEN},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'保存失败');return d}
async function load(){try{const r=await fetch('/api/state');if(!r.ok)throw Error();state=await r.json();renderServices();$('direction').textContent=state.config.direction||'收集参考 · 扩展选题 · 持续创作';filters();render();$('notice').textContent=''}catch(e){$('notice').textContent='连接失败，请确认内容库服务正在运行。'}}
function sourceTitle(m){return (m.original_title_verified===true||['manual','share_text','tikhub'].includes(m.title_source))&&m.title?m.title:'原帖标题待补'}
function statusLabel(s){return ({success:'实测通过',partial:'部分取得',failed:'失败',cached:'沿用已存原文',not_requested:'本次未调用',not_configured:'尚未配置',deferred:'预算已用完'})[s]||'未测试'}
function renderServices(){const box=$('services');box.replaceChildren();for(const [key,name] of [['getnote','Get笔记'],['tikhub','TikHub']]){const c=(state.services||{})[key]||{};const n=el('div',name+'：'+statusLabel(c.status),'service '+(c.status==='success'?'good':c.status==='failed'?'bad':''));n.title=[c.checked_at?'最近测试：'+c.checked_at:'尚未进行真实接口测试',c.message||''].join('\n');box.append(n)}}
function resultCell(m){const c=el('td');c.append(el('div',m.source_content?'原始内容已取得，待核验':m.description?'仅笔记正文，口播稿待补':'原文待提取'));for(const [key,name] of [['getnote','Get'],['tikhub','TikHub']]){const check=(m.provider_checks||{})[key];if(check)c.append(el('div',name+'：'+statusLabel(check.status),'small '+(check.status==='failed'?'bad':'')))}if((m.issues||[]).length)c.append(el('div',m.issues[0],'small bad'));return c}
function filters(){const keep=$('filter').value;const values=tab==='materials'?[...new Set(state.materials.map(m=>m.category||'待分类'))]:['待制作','制作中','已发布','暂缓'];$('filter').replaceChildren(new Option('全部'+(tab==='materials'?'分类':'状态'),''),...values.map(v=>new Option(v,v)));if(values.includes(keep))$('filter').value=keep;}
function render(){const list=$('list'),query=$('search').value.trim().toLowerCase(),filter=$('filter').value;const rows=state[tab].filter(x=>JSON.stringify(x).toLowerCase().includes(query)&&(!filter||(tab==='materials'?(x.category||'待分类'):x.status)===filter));$('materialsTab').textContent='爆款素材库 · '+state.materials.length;$('topicsTab').textContent='选题库 · '+state.topics.length;$('add').hidden=tab!=='materials';list.replaceChildren();if(!rows.length){list.append(el('div',tab==='materials'?'还没有符合条件的素材。先给 AI 一条小红书作品链接。':'还没有符合条件的选题。请 AI 完整阅读素材后，与你确认要入库的选题。','empty'));return}const table=el('table'),head=el('tr');(tab==='materials'?['原帖 / 作者','模板分类','采集情况（分工具）','数据快照','查看']:['选题 / 类型','参考与切入点','制作进度','发布链接']).forEach(t=>head.append(el('th',t)));const thead=el('thead');thead.append(head);table.append(thead);const body=el('tbody');for(const x of rows){const row=el('tr');if(tab==='materials'){const title=el('td');title.append(el('div',sourceTitle(x),'title'),el('small',x.author||'作者待补'));if(x.getnote_title&&sourceTitle(x)==='原帖标题待补')title.append(el('div','Get生成标题（不是原题）：'+x.getnote_title,'small'));row.append(title,cell(x.category||'待分类'),resultCell(x));const m=x.metrics||{};row.append(cell('赞 '+(m.likes??'—')+' / 藏 '+(m.saves??'—')+' / 评 '+(m.comments??'—')));const c=el('td'),b=el('button','查看原文');b.onclick=()=>detail(x);c.append(b);row.append(c)}else{const title=el('td');const open=el('button',x.title);open.onclick=()=>topicDetail(x);title.append(open,el('br'),el('span',x.kind,'pill'));const refs=el('td');refs.append(el('div',x.angle||x.core_question,'desc'),el('small','参考 '+x.references.length+' 条'));const progress=el('td'),s=el('select');s.setAttribute('aria-label',x.title+'的制作状态');['待制作','制作中','已发布','暂缓'].forEach(v=>s.append(new Option(v,v)));s.value=x.status;s.onchange=async()=>{let patch={status:s.value};if(s.value==='已发布'&&!x.published_url){const url=prompt('粘贴已发布作品的小红书链接');if(!url){s.value=x.status;return}patch.published_url=url}try{await post('/api/topic',{id:x.id,patch});await load()}catch(e){$('notice').textContent=e.message;s.value=x.status}};progress.append(s);const pub=el('td');if(x.published_url)pub.append(link(x.published_url,'打开作品'));else pub.append(el('small','未发布'));row.append(title,refs,progress,pub)}body.append(row)}table.append(body);list.append(table)}
function topicDetail(t){const box=$('detailBody');box.replaceChildren(el('h2',t.title));section(box,'具体问题 / 自己的切入点',[t.core_question,t.angle].filter(Boolean).join('\n'));section(box,'制作形式',t.format);section(box,'待准备材料',(t.materials_needed||[]).join('\n'));section(box,'待核实事实',(t.verification_needed||[]).join('\n'));box.append(el('h3','参考作品'));for(const id of t.references){const m=state.materials.find(x=>x.id===id);if(m){box.append(link(m.url,sourceTitle(m)),el('br'))}}$('detail').showModal()}function cell(t){return el('td',t)}function section(parent,title,text){parent.append(el('h3',title),el('pre',text||'待补充'))}
function detail(m){const box=$('detailBody');box.replaceChildren(el('h2',sourceTitle(m)),link(m.url,'打开原作品'));section(box,'原题来源',m.title_source||'尚未核实，未把生成标题当原题');if(m.getnote_title)section(box,'Get笔记生成标题（不是原帖标题）',m.getnote_title);if(m.cover_url&&/^https?:\/\//.test(m.cover_url)){const image=el('img');image.src=m.cover_url;image.alt='作品封面';image.className='cover';box.append(el('br'),image)}if(!m.cover_url&&(m.image_urls||[]).length){box.append(el('h3','提取到的参考图片（封面身份未核实）'));const image=el('img');if(/^https?:\/\//.test(m.image_urls[0]))image.src=m.image_urls[0];image.alt='参考图片，未核实是否为封面';image.className='cover';box.append(image)}section(box,'原始内容',m.source_content||m.description);section(box,'各工具最近结果',Object.entries(m.provider_checks||{}).map(([k,v])=>k+'：'+statusLabel(v.status)+(v.message?'；'+v.message:'')).join('\n'));section(box,'AI 归纳 / 借鉴点',[m.ai_summary,m.learning_point].filter(Boolean).join('\n'));section(box,'资料边界',[m.source_content_kind,'口播稿：'+(m.transcript_status||'未核验'),...(m.issues||[])].filter(Boolean).join('\n'));$('detail').showModal()}
$('refresh').onclick=load;$('search').oninput=render;$('filter').onchange=render;$('materialsTab').onclick=()=>switchTab('materials');$('topicsTab').onclick=()=>switchTab('topics');function switchTab(v){tab=v;$('materialsTab').classList.toggle('active',v==='materials');$('topicsTab').classList.toggle('active',v==='topics');filters();render()}
$('closeDetail').onclick=()=>$('detail').close();$('add').onclick=()=>$('editor').showModal();$('cancelEdit').onclick=()=>$('editor').close();$('materialForm').onsubmit=async event=>{event.preventDefault();const data=Object.fromEntries(new FormData(event.target));data.provider='手动录入';data.extraction_status=data.source_content?'待核验':'待提取';try{await post('/api/material',data);$('editor').close();event.target.reset();await load()}catch(e){$('notice').textContent=e.message}};load();
</script></body></html>
